site_name: Binary Exploitation(日本語訳)
site_description: rosehgal/BinExp の日本語訳
site_url: https://0xff-minusone.github.io/BinExp-ja/
repo_url: https://github.com/0xFF-MinusOne/BinExp-ja
docs_dir: .site-src
copyright: >-
  日本語訳。原著:
  <a href="https://github.com/rosehgal/BinExp">rosehgal/BinExp</a>
  / ライセンス: <a href="https://github.com/0xFF-MinusOne/BinExp-ja/blob/main/LICENSE">MIT</a>
  <br>Unofficial Japanese translation of <a href="https://github.com/rosehgal/BinExp">rosehgal/BinExp</a>. Not reviewed or endorsed by the original authors; the original text prevails.

theme:
  name: material
  language: ja
  font: false
  logo: assets/minusone-mark.svg
  favicon: assets/minusone-avatar-light.svg
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate

nav:
  - Binary Exploitation: index.md
  - Lecture 1: Lecture1/README.md
  - Lecture 1.5: Lecture1.5/README.md
  - Lecture 2: Lecture2/README.md
  - Lecture 3: Lecture3/README.md
  - Lecture 3.5: Lecture3.5/README.md
  - Lecture 5: Lecture5/README.md
  - Lecture 6: Lecture6/README.md
  - Lecture 7: Lecture7/README.md

plugins:
  - search:
      lang: ja

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rosehgal/BinExp
      name: 原著 rosehgal/BinExp

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/ja-docs.css
  - assets/mkdocs.css
  - assets/minusone.css

extra_javascript:
  - assets/ja-docs.js
